<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110f">
<title>Düğün</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="on">
    <p class="eyebrow" data-i18n="date">18 Haziran 2022</p>
    <h1 data-i18n="title">Düğün</h1>
    <label for="pw" class="sr" data-i18n="password">Şifre</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required
           data-i18n-ph="password" placeholder="Şifre" autofocus>
    <label class="remember"><input id="remember" type="checkbox" checked> <span data-i18n="remember">Bu cihazda hatırla</span></label>
    <button id="unlockBtn" type="submit" data-i18n="open">Aç</button>
    <p id="lockMsg" class="lock-msg" role="status" aria-live="polite"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <h1 id="galleryTitle" class="brand">Düğün</h1>
      <span id="count" class="count"></span>
      <div class="actions">
        <button id="favFilter" class="chip-btn" aria-pressed="false"><span aria-hidden="true">♡</span> <span data-i18n="favorites">Favoriler</span></button>
        <button id="playAll" class="chip-btn"><span aria-hidden="true">▶</span> <span data-i18n="slideshow">Slayt</span></button>
        <button id="lang" class="chip-btn" aria-label="Language">EN</button>
        <button id="logout" class="chip-btn" data-i18n="lock">Kilitle</button>
      </div>
    </div>
    <nav id="chips" class="chips" aria-label="Bölümler"></nav>
  </header>
  <div id="sections"></div>
  <p id="empty" class="empty" hidden data-i18n="noFavs">Henüz favori yok. Bir fotoğrafta ♡ simgesine dokunun.</p>
</div>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Fotoğraf">
  <div class="stage" id="stage">
    <img id="vImg" alt="">
    <div id="vSpin" class="spin" hidden></div>
  </div>
  <div class="v-top">
    <span id="vPos" class="v-pos"></span>
    <span id="vMeta" class="v-meta"></span>
    <div class="v-actions">
      <button id="vFav" class="v-btn" aria-label="Favori">♡</button>
      <button id="vPlay" class="v-btn" aria-label="Slayt">▶</button>
      <a id="vDl" class="v-btn v-dl" href="#" rel="noopener"><span aria-hidden="true">⤓</span> <span data-i18n="download">Orijinal</span> <small id="vSize"></small></a>
      <button id="vClose" class="v-btn" aria-label="Kapat">✕</button>
    </div>
  </div>
  <button id="vPrev" class="v-nav prev" aria-label="Önceki">‹</button>
  <button id="vNext" class="v-nav next" aria-label="Sonraki">›</button>
</div>

<script src="app.js"></script>
</body>
</html>
